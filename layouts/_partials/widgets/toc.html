{{- /* TOC widget */ -}}
{{ $page := . }}

<div class="c-toc">
    {{- /* Reading rail */ -}}
    <div class="c-toc__rail">
        <div class="c-toc__rail-fill" id="reading-progress"></div>
    </div>

    <div class="c-toc__body">
        <div class="c-toc__list">
            
            {{- /* 1. New Floating Title */ -}}
            <div class="c-toc__floating-title" id="floating-title-container">
                <a href="#">{{ $page.Title }}</a>
            </div>

            {{- /* 2. Table of contents (Hugo-generated) */ -}}
            {{- with $toc := $page.TableOfContents }}
                {{- if and (site.Params.enableTOC) $toc }}
                    {{ $toc }}
                {{- end }}
            {{- end }}
            
        </div>
    </div>
</div>
